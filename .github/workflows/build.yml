name: Build, test and release

on:
  push:
    branches: ['**']
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build and test ${{ matrix.target }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: linux-x86_64
          - os: macos-15
            target: macos-arm64
          - os: windows-latest
            target: windows-x86_64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Linux dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libssl-dev openssl
      - name: macOS dependencies
        if: runner.os == 'macOS'
        run: brew list openssl@3 || brew install openssl@3
      - name: Windows dependencies
        if: runner.os == 'Windows'
        shell: pwsh
        run: '& "$env:VCPKG_INSTALLATION_ROOT/vcpkg.exe" install openssl:x64-windows-static'
      - name: Configure Linux
        if: runner.os == 'Linux'
        run: cmake -S source -B build -DCMAKE_BUILD_TYPE=Release -DSFT_STATIC_OPENSSL=ON
      - name: Configure macOS
        if: runner.os == 'macOS'
        run: cmake -S source -B build -DCMAKE_BUILD_TYPE=Release -DSFT_STATIC_OPENSSL=ON -DOPENSSL_ROOT_DIR="$(brew --prefix openssl@3)"
      - name: Configure Windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: >-
          cmake -S source -B build -A x64
          -DCMAKE_TOOLCHAIN_FILE="$env:VCPKG_INSTALLATION_ROOT/scripts/buildsystems/vcpkg.cmake"
          -DVCPKG_TARGET_TRIPLET=x64-windows-static -DSFT_STATIC_OPENSSL=ON
          -DSFT_OPENSSL_EXECUTABLE="C:/Program Files/Git/usr/bin/openssl.exe"
          -DSFT_WINDOWS_OUTPUT_DIR="$env:GITHUB_WORKSPACE/build/bin"
      - name: Build
        run: cmake --build build --config Release --parallel
      - name: Integration tests
        run: ctest --test-dir build -C Release --output-on-failure
      - name: Package Unix
        if: runner.os != 'Windows'
        run: python source/scripts/package_release.py --target ${{ matrix.target }} --binary-dir build --output-dir release
      - name: Package Windows
        if: runner.os == 'Windows'
        run: python source/scripts/package_release.py --target ${{ matrix.target }} --binary-dir build/bin --output-dir release
      - uses: actions/upload-artifact@v4
        with:
          name: sft-${{ matrix.target }}
          path: release/*
          if-no-files-found: error

  sanitizers:
    name: Linux sanitizers
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: sudo apt-get update && sudo apt-get install -y libssl-dev openssl
      - run: cmake -S source -B build -DCMAKE_BUILD_TYPE=Debug -DSFT_SANITIZE=ON
      - run: cmake --build build --parallel
      - run: ctest --test-dir build --output-on-failure

  release:
    name: Publish tagged release
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    needs: [build, sanitizers]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: sft-*
          merge-multiple: true
          path: release
      - name: Create checksums
        working-directory: release
        run: sha256sum sft-* > SHA256SUMS.txt
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: gh release create "$GITHUB_REF_NAME" release/* --verify-tag --generate-notes --title "$GITHUB_REF_NAME"
